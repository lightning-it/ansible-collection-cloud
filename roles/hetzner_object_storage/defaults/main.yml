---
hetzner_object_storage_action: plan
hetzner_object_storage_delegate_to: localhost

hetzner_object_storage_endpoint: ""
hetzner_object_storage_region: ""
hetzner_object_storage_bucket: ""
hetzner_object_storage_prefix: ""
hetzner_object_storage_bucket_project_id: ""
hetzner_object_storage_external_principals: []

hetzner_object_storage_access_key: ""
hetzner_object_storage_secret_key: ""

hetzner_object_storage_use_vault: false
hetzner_object_storage_vault_addr: ""
hetzner_object_storage_vault_token: ""
hetzner_object_storage_vault_kv_mount: secret
hetzner_object_storage_vault_kv_path: ""
hetzner_object_storage_vault_access_key_field: access_key
hetzner_object_storage_vault_secret_key_field: secret_key

hetzner_object_storage_versioning: true
hetzner_object_storage_object_lock_enabled: true
hetzner_object_storage_object_lock_mode: GOVERNANCE
hetzner_object_storage_object_lock_retention_days: 30
hetzner_object_storage_abort_incomplete_multipart_upload_days: 7
hetzner_object_storage_validate_certs: true
